<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #0f172a;
    --fg: #f1f5f9;
    --cell-bg: #1e293b;
    --cell-bg-hover: #334155;
    --accent: #38bdf8;
    --x-color: #f87171;
    --o-color: #34d399;
    --border: #475569;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 2rem 1rem;
    text-align: center;
  }
  h1 {
    margin: 0 0 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  #mode-controls {
    display: inline-flex;
    gap: 0;
    margin-bottom: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  #mode-controls button {
    background: var(--cell-bg);
    color: var(--muted);
    border: none;
    padding: 0.5rem 1rem;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #mode-controls button + button { border-left: 1px solid var(--border); }
  #mode-controls button:hover { background: var(--cell-bg-hover); color: var(--fg); }
  #mode-controls button[aria-pressed="true"] {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
  }
  #mode-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status {
    font-size: 1.25rem;
    margin: 1rem 0;
    min-height: 1.5em;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 1rem auto;
    width: min(360px, 90vw);
    aspect-ratio: 1 / 1;
  }
  .cell {
    background: var(--cell-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: clamp(2rem, 12vw, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    font-family: inherit;
    padding: 0;
    line-height: 1;
  }
  .cell:hover:not(:disabled) { background: var(--cell-bg-hover); }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cell:disabled { cursor: not-allowed; }
  .cell[data-mark="X"] { color: var(--x-color); }
  .cell[data-mark="O"] { color: var(--o-color); }
  #reset {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 1rem;
  }
  #reset:hover { filter: brightness(1.1); }
  #reset:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tic-Tac-Toe</h1>
  <div id="mode-controls" role="group" aria-label="Game mode">
    <button id="mode-two-player" type="button" aria-pressed="true">Two players</button>
    <button id="mode-vs-computer" type="button" aria-pressed="false">Vs computer</button>
  </div>
  <div id="status" aria-live="polite">X to move</div>
  <div id="board" role="grid" aria-label="Tic-tac-toe board">
    <button class="cell" type="button" data-cell="0" aria-label="Cell 1"></button>
    <button class="cell" type="button" data-cell="1" aria-label="Cell 2"></button>
    <button class="cell" type="button" data-cell="2" aria-label="Cell 3"></button>
    <button class="cell" type="button" data-cell="3" aria-label="Cell 4"></button>
    <button class="cell" type="button" data-cell="4" aria-label="Cell 5"></button>
    <button class="cell" type="button" data-cell="5" aria-label="Cell 6"></button>
    <button class="cell" type="button" data-cell="6" aria-label="Cell 7"></button>
    <button class="cell" type="button" data-cell="7" aria-label="Cell 8"></button>
    <button class="cell" type="button" data-cell="8" aria-label="Cell 9"></button>
  </div>
  <button id="reset" type="button">Reset</button>
</main>
<script>
(function () {
  "use strict";

  var WINNING_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  var MODE_TWO_PLAYER = 'two-player';
  var MODE_VS_COMPUTER = 'vs-computer';
  var HUMAN = 'X';
  var COMPUTER = 'O';
  // Delay before the computer moves so the human can see their move land.
  var COMPUTER_MOVE_DELAY_MS = 350;

  var board;
  var currentPlayer;
  var gameOver;
  var mode = MODE_TWO_PLAYER;
  var computerThinking = false;
  var computerMoveTimer = null;

  var cells = Array.prototype.slice.call(
    document.querySelectorAll('[data-cell]')
  );
  var statusEl = document.getElementById('status');
  var resetEl = document.getElementById('reset');
  var modeTwoPlayerBtn = document.getElementById('mode-two-player');
  var modeVsComputerBtn = document.getElementById('mode-vs-computer');

  function checkWinnerOn(b) {
    for (var i = 0; i < WINNING_LINES.length; i++) {
      var line = WINNING_LINES[i];
      var a = b[line[0]];
      var c = b[line[1]];
      var d = b[line[2]];
      if (a && a === c && a === d) {
        return { winner: a, line: line };
      }
    }
    return null;
  }

  function isBoardFull(b) {
    for (var i = 0; i < b.length; i++) {
      if (!b[i]) return false;
    }
    return true;
  }

  function checkWinner() { return checkWinnerOn(board); }
  function isDraw() { return isBoardFull(board); }

  // Minimax for perfect-play tic-tac-toe.
  // Returns { score, move } from `player`'s perspective.
  // Score: +10 - depth on win, depth - 10 on loss, 0 on draw.
  function minimax(b, player, toMove, depth) {
    var result = checkWinnerOn(b);
    if (result) {
      if (result.winner === player) return { score: 10 - depth, move: -1 };
      return { score: depth - 10, move: -1 };
    }
    if (isBoardFull(b)) return { score: 0, move: -1 };

    var maximizing = toMove === player;
    var bestScore = maximizing ? -Infinity : Infinity;
    var bestMove = -1;
    var nextToMove = toMove === 'X' ? 'O' : 'X';

    for (var i = 0; i < b.length; i++) {
      if (b[i]) continue;
      b[i] = toMove;
      var sub = minimax(b, player, nextToMove, depth + 1);
      b[i] = '';
      if (maximizing) {
        if (sub.score > bestScore) { bestScore = sub.score; bestMove = i; }
      } else {
        if (sub.score < bestScore) { bestScore = sub.score; bestMove = i; }
      }
    }
    return { score: bestScore, move: bestMove };
  }

  function chooseComputerMove() {
    var snapshot = board.slice();
    var result = minimax(snapshot, COMPUTER, COMPUTER, 0);
    return result.move;
  }

  function render() {
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var mark = board[i];
      cell.textContent = mark || '';
      if (mark) {
        cell.setAttribute('data-mark', mark);
        cell.disabled = true;
      } else {
        cell.removeAttribute('data-mark');
        // In vs-computer mode, lock cells while it's the computer's turn so
        // the human can't preempt the AI.
        var lockForComputer = mode === MODE_VS_COMPUTER &&
          (computerThinking || currentPlayer === COMPUTER);
        cell.disabled = gameOver || lockForComputer;
      }
    }
  }

  function setStatus(text) { statusEl.textContent = text; }

  function statusForTurn() {
    if (mode === MODE_VS_COMPUTER) {
      return currentPlayer === HUMAN ? 'Your turn (X)' : 'Computer thinking...';
    }
    return currentPlayer + ' to move';
  }

  function applyMove(index, player) {
    board[index] = player;

    var result = checkWinner();
    if (result) {
      gameOver = true;
      render();
      setStatus(result.winner + ' wins!');
      return true;
    }
    if (isDraw()) {
      gameOver = true;
      render();
      setStatus("It's a draw");
      return true;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    render();
    setStatus(statusForTurn());
    return false;
  }

  function scheduleComputerMove() {
    if (gameOver) return;
    if (mode !== MODE_VS_COMPUTER) return;
    if (currentPlayer !== COMPUTER) return;

    computerThinking = true;
    render();

    if (computerMoveTimer !== null) clearTimeout(computerMoveTimer);
    computerMoveTimer = setTimeout(function () {
      computerMoveTimer = null;
      if (gameOver || mode !== MODE_VS_COMPUTER || currentPlayer !== COMPUTER) {
        computerThinking = false;
        render();
        return;
      }
      var move = chooseComputerMove();
      computerThinking = false;
      if (move < 0 || move > 8 || board[move]) {
        // Fallback: first empty cell.
        for (var i = 0; i < board.length; i++) {
          if (!board[i]) { move = i; break; }
        }
      }
      applyMove(move, COMPUTER);
    }, COMPUTER_MOVE_DELAY_MS);
  }

  function handleCellClick(event) {
    if (gameOver) return;
    if (mode === MODE_VS_COMPUTER && (computerThinking || currentPlayer === COMPUTER)) {
      return;
    }
    var cell = event.currentTarget;
    var index = parseInt(cell.getAttribute('data-cell'), 10);
    if (isNaN(index) || index < 0 || index > 8) return;
    if (board[index]) return;

    var finished = applyMove(index, currentPlayer);
    if (finished) return;

    if (mode === MODE_VS_COMPUTER && currentPlayer === COMPUTER) {
      scheduleComputerMove();
    }
  }

  function resetGame() {
    if (computerMoveTimer !== null) {
      clearTimeout(computerMoveTimer);
      computerMoveTimer = null;
    }
    computerThinking = false;
    board = ['', '', '', '', '', '', '', '', ''];
    currentPlayer = 'X';
    gameOver = false;
    render();
    setStatus(statusForTurn());
    // X (human) always moves first in vs-computer mode, so no auto-move on reset.
  }

  function setMode(newMode) {
    if (newMode !== MODE_TWO_PLAYER && newMode !== MODE_VS_COMPUTER) return;
    if (mode === newMode) {
      resetGame();
      return;
    }
    mode = newMode;
    modeTwoPlayerBtn.setAttribute('aria-pressed', String(mode === MODE_TWO_PLAYER));
    modeVsComputerBtn.setAttribute('aria-pressed', String(mode === MODE_VS_COMPUTER));
    resetGame();
  }

  for (var i = 0; i < cells.length; i++) {
    cells[i].addEventListener('click', handleCellClick);
  }
  resetEl.addEventListener('click', resetGame);
  modeTwoPlayerBtn.addEventListener('click', function () { setMode(MODE_TWO_PLAYER); });
  modeVsComputerBtn.addEventListener('click', function () { setMode(MODE_VS_COMPUTER); });

  resetGame();
})();
</script>
</body>
</html>
